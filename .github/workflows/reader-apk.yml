name: Reader APK - focused build

on:
  workflow_dispatch:
  push:
    branches: [feature/reader-ui-overhaul]
    paths:
      - 'app/**'
      - 'core-*/**'
      - 'reader-*/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/reader-apk.yml'

permissions:
  contents: read

concurrency:
  group: reader-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-37.1' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Environment and memory diagnostics
        run: |
          uname -a
          java -version
          free -h
          df -h .
      - name: Compile and package debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace --max-workers=2 --no-configuration-cache -Pkotlin.daemon.jvmargs=-Xmx2g -Dorg.gradle.jvmargs=-Xmx3g
      - name: Verify debug APK and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | sort)
          if [ "${#apks[@]}" -eq 0 ]; then echo 'No APK produced' >&2; exit 1; fi
          : > app/build/outputs/apk/debug/SHA256SUMS
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")") >> app/build/outputs/apk/debug/SHA256SUMS
          done
      - uses: actions/upload-artifact@v6
        with:
          name: Kototoro-Reader-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reader-apk-diagnostics
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
